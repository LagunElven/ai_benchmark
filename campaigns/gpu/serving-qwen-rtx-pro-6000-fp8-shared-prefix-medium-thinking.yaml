schema_version: "1.0"
name: enterprise-serving-qwen3.8-fp8-rtx-pro-6000-shared-prefix-medium-thinking
version: 0.25.19-qwen3.8-fp8-shared-prefix-medium-thinking

endpoint:
  base_url: http://127.0.0.1:8000/v1
  api_key_env: BENCHMARK_API_KEY

model: Qwen3.8-27B
model_metadata:
  source_repository: https://huggingface.co/Qwen/Qwen3.8-27B-FP8
  revision: 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
  tokenizer_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  quantization: FP8
  dtype: FP8
tokenizer:
  type: huggingface
  repository: Qwen/Qwen3.8-27B
  revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
  local_files_only: false

hardware:
  accelerator_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
  gpu_count: 1
  gpu_memory_gb: 96
  driver_version: 610.43.02
  cuda_version: "13.3"
  cpu_model: Xeon Platform 8559C
  host_memory_gb: null

serving:
  engine: vllm
  engine_version: 0.29.0
  launch_command: >-
    HF_HOME=/workspace/models vllm serve Qwen/Qwen3.8-27B-FP8
    --revision 017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
    --tokenizer Qwen/Qwen3.8-27B
    --tokenizer-revision 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    --served-model-name Qwen3.8-27B
    --tensor-parallel-size 1 --pipeline-parallel-size 1
    --max-model-len 262144 --max-num-seqs 16 --reasoning-parser qwen3
    --kv-cache-dtype fp8 --enable-prefix-caching --port 8001
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  max_model_length: 262144
  max_num_seqs: 16
  reasoning_parser: qwen3
  prefix_caching: true
  kv_cache_dtype: fp8
  batch_size: null

matrix:
  concurrency: [1, 2, 5, 10]
  context_tokens: [8000, 32000, 64000, 100000, 200000]
  prefix_modes: [shared-prefix]
  warmup_batches: 1
  repetitions: 20

request:
  timeout_seconds: 1800
  max_output_tokens: 256
  temperature: 0.0
  top_p: 1.0
  seed: 42
  stream: true
  chat_template_kwargs:
    enable_thinking: true
    reasoning_effort: medium
