    comparison_group: quantization-rtx-pro-6000
    hardware_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
    gpu_count: 1
    artifact_variant: nvfp4
    notes: NVFP4 quantization campaign on RTX PRO 6000 Server Edition; compare with C-004/C-006 after the vLLM compatibility smoke.
  - id: C-012
    status: exploratory
    comparison_type: controlled_quantization
    comparison_group: quantization-dgx-spark
    hardware_model: NVIDIA DGX Spark / GB10
    gpu_count: 1
    artifact_variant: nvfp4
    notes: NVFP4 quantization campaign on DGX Spark / GB10; compare with C-009/C-010 after the vLLM compatibility smoke.
  - id: C-013
    status: exploratory
    comparison_type: operational_solution
    comparison_group: thinking-mode-rtx-pro-6000
    hardware_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
    gpu_count: 1
    artifact_variant: bf16
    notes: BF16 no-thinking request profile; compare operationally with C-004, not as a controlled hardware result.
  - id: C-014
    status: planned
    comparison_type: operational_solution
    comparison_group: shared-prefix-quality-rtx-pro-6000
    hardware_model: NVIDIA RTX PRO 6000 Blackwell Server Edition
    gpu_count: 1
