[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-llm-bench"
version = "0.17.0"
description = "Reproducible enterprise LLM quality and serving benchmark runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.11,<1",
]

[project.scripts]
enterprise-llm-bench = "runner.cli:main"

[tool.setuptools]
packages = ["runner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
