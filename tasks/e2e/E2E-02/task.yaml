id: E2E-02
revision: 1
name: Preserve a stock reservation across Angular Axon and JPA layers
category: e2e
difficulty: hard
suites: [core, full]
tags: [e2e, angular, axon, jpa, event-sourcing, projection]
modes: [one-shot, repair]
toolchain:
  language: python
  version: "3.11"
  requirements: [python3.11+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [jpa_projection.py]
context:
  inputs: [angular_client.py, axon_aggregate.py, jpa_projection.py, workflow.py]
validation:
  public:
    - name: Angular to JPA contract
      command: [python, public-tests/check.py]
  hidden:
    - name: hidden projection checks
      command: [python, hidden_check.py]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified, relevant_file_precision, relevant_file_recall]
metric_extractors: []
