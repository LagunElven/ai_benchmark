id: AXON-09
revision: 1
name: Propagate optimistic locking conflicts and bound retries
category: axon
difficulty: hard
suites: [core, full]
tags: [axon, optimistic-locking, conflict, retry, aggregate]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/OptimisticCommandHandler.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/OptimisticCommandHandler.java, public-tests/OptimisticCommandHandlerPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, OptimisticCommandHandlerPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/OptimisticCommandHandler.java, OptimisticCommandHandlerHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, OptimisticCommandHandlerHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
