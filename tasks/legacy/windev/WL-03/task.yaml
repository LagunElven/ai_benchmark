id: WL-03
revision: 1
name: Correct a WLanguage order-charge rule
category: windev
difficulty: hard
suites: [core, full]
tags: [windev, wlanguage, business-rule, decimal, java]
modes: [one-shot, repair]
toolchain:
  language: wlanguage-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/OrderCharge.java]
context:
  documents: [legacy/order-charge.wlanguage.pseudo, fixtures/wlanguage-reference.md, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/OrderCharge.java, public-tests/OrderChargePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, OrderChargePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/OrderCharge.java, OrderChargeHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, OrderChargeHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
