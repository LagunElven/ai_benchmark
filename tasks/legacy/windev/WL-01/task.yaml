id: WL-01
revision: 1
name: Reproduce a WLanguage shipment status rule
category: windev
difficulty: medium
suites: [core, full]
tags: [windev, wlanguage, comprehension, business-rule, java]
modes: [one-shot, repair]
toolchain:
  language: wlanguage-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/ShipmentStatus.java]
context:
  documents: [legacy/shipment-status.wlanguage.pseudo, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/ShipmentStatus.java, public-tests/ShipmentStatusPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, ShipmentStatusPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/ShipmentStatus.java, ShipmentStatusHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, ShipmentStatusHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
