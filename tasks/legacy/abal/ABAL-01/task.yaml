id: ABAL-01
revision: 1
name: Reproduce an ABAL tax-band rule
category: abal
difficulty: medium
suites: [core, full]
tags: [abal, advanced-business-application-language, comprehension, business-rule, java]
modes: [one-shot, repair]
toolchain:
  language: abal-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/TaxBand.java]
context:
  documents: [legacy/tax-band.abal.pseudo, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/TaxBand.java, public-tests/TaxBandPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, TaxBandPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/TaxBand.java, TaxBandHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, TaxBandHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
