id: ABAL-03
revision: 1
name: Migrate an ABAL annual-allowance rule to Java
category: abal
difficulty: hard
suites: [core, full]
tags: [abal, advanced-business-application-language, migration, decimal, java]
modes: [one-shot, repair]
toolchain:
  language: abal-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/AnnualAllowance.java]
context:
  documents: [legacy/annual-allowance.abal.pseudo, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/AnnualAllowance.java, public-tests/AnnualAllowancePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, AnnualAllowancePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/AnnualAllowance.java, AnnualAllowanceHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, AnnualAllowanceHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
