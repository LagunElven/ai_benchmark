id: DELPHI-02
revision: 1
name: Preserve Delphi owned-resource lifecycle
category: delphi
difficulty: hard
suites: [core, full]
tags: [delphi, object-lifecycle, resources, java]
modes: [one-shot, repair]
toolchain:
  language: delphi-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5500
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/ResourceOwner.java]
context:
  documents: [legacy/ResourceOwner.pas, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/ResourceOwner.java, public-tests/ResourceOwnerPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, ResourceOwnerPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/ResourceOwner.java, ResourceOwnerHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, ResourceOwnerHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
