id: DELPHI-01
revision: 1
name: Reproduce a Delphi stock fulfilment rule
category: delphi
difficulty: medium
suites: [core, full]
tags: [delphi, comprehension, business-rule, java]
modes: [one-shot, repair]
toolchain:
  language: delphi-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/FulfillmentStatus.java]
context:
  documents: [legacy/FulfillmentStatus.pas, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/FulfillmentStatus.java, public-tests/FulfillmentStatusPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, FulfillmentStatusPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/FulfillmentStatus.java, FulfillmentStatusHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, FulfillmentStatusHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
