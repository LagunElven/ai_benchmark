id: COBOL-02
revision: 1
name: Correct a preferred-customer discount rule
category: cobol
difficulty: medium
suites: [core, full]
tags: [cobol, business-rule, migration, java]
modes: [one-shot, repair]
toolchain:
  language: cobol-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/DiscountRule.java]
context:
  documents: [legacy/discount.cbl, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/DiscountRule.java, public-tests/DiscountRulePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, DiscountRulePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/DiscountRule.java, DiscountRuleHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, DiscountRuleHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
