id: COBOL-03
revision: 1
name: Process sequential sales with packed-decimal amounts
category: cobol
difficulty: hard
suites: [core, full]
tags: [cobol, sequential-file, pic, comp-3, decimal, java]
modes: [one-shot, repair]
toolchain:
  language: cobol-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/PostedSales.java]
context:
  documents: [legacy/daily-sales.cbl, fixtures/input-format.md, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/PostedSales.java, public-tests/PostedSalesPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, PostedSalesPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/PostedSales.java, PostedSalesHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, PostedSalesHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
