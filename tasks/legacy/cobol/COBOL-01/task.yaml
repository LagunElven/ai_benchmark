id: COBOL-01
revision: 1
name: Reproduce an account-status COBOL program
category: cobol
difficulty: medium
suites: [core, full]
tags: [cobol, comprehension, business-rule, java, fixed-format]
modes: [one-shot, repair]
toolchain:
  language: cobol-java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/AccountStatus.java]
context:
  documents: [legacy/account-status.cbl, fixtures/manifest.json]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/AccountStatus.java, public-tests/AccountStatusPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, AccountStatusPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/AccountStatus.java, AccountStatusHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, AccountStatusHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
