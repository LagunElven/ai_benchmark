id: WEB-04
revision: 1
name: Add authentication headers in an HTTP interceptor
category: web
difficulty: medium
suites: [core, full]
tags: [web, angular, interceptor, bearer, csrf]
modes: [one-shot, repair]
toolchain:
  language: javascript
  version: "node 18+"
  requirements: [node]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [interceptor.js]
validation:
  public:
    - name: public behavior
      command: [node, public-tests/interceptor-public-test.js]
  hidden:
    - name: hidden behavior
      command: [node, interceptor-hidden-test.js]
metrics: [hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
