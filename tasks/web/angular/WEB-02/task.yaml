id: WEB-02
revision: 1
name: Clean up an RxJS-style subscription
category: web
difficulty: medium
suites: [core, full]
tags: [web, angular, rxjs, subscription, lifecycle]
modes: [one-shot, repair]
toolchain:
  language: javascript
  version: "node 18+"
  requirements: [node]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [subscription.js]
validation:
  public:
    - name: public behavior
      command: [node, public-tests/subscription-public-test.js]
  hidden:
    - name: hidden behavior
      command: [node, subscription-hidden-test.js]
metrics: [hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
