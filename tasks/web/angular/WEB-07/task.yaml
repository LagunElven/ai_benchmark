id: WEB-07
revision: 1
name: Keep cart state consistent across signals and subscribers
category: web
difficulty: hard
suites: [core, full]
tags: [web, angular, signals, rxjs, state-management, immutable]
modes: [one-shot, repair]
toolchain:
  language: javascript
  version: "node 18+"
  requirements: [node]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [cart-store.js]
validation:
  public:
    - name: public behavior
      command: [node, public-tests/cart-store-public-test.js]
  hidden:
    - name: hidden behavior
      command: [node, cart-store-hidden-test.js]
metrics: [hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
