id: WEB-09
revision: 1
name: Validate an OAuth Capacitor deep-link callback
category: web
difficulty: hard
suites: [core, full]
tags: [web, angular, ionic, capacitor, oauth, deep-link, security]
modes: [one-shot, repair]
toolchain:
  language: javascript
  version: "node 18+"
  requirements: [node]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [oauth-deep-link.js]
validation:
  public:
    - name: public behavior
      command: [node, public-tests/oauth-deep-link-public-test.js]
  hidden:
    - name: hidden behavior
      command: [node, oauth-deep-link-hidden-test.js]
metrics: [hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
