id: JAVA-01
revision: 1
name: Select the first usable email with null-safe streams
category: java
difficulty: easy
suites: [core, full]
tags: [java, streams, optional, null-safety]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/EmailSelector.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/EmailSelector.java, public-tests/EmailSelectorPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, EmailSelectorPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/EmailSelector.java, EmailSelectorHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, EmailSelectorHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
