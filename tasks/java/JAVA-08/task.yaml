id: JAVA-08
revision: 1
name: Evolve a greeting API compatibly
category: java
difficulty: medium
suites: [core, full]
tags: [java, api, backward-compatibility, localization]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/CustomerGreeting.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/CustomerGreeting.java, public-tests/CustomerGreetingPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, CustomerGreetingPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/CustomerGreeting.java, CustomerGreetingHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, CustomerGreetingHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
