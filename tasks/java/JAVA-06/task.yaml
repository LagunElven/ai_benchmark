id: JAVA-06
revision: 1
name: Diagnose and fix a concurrent audit sequence race
category: java
difficulty: hard
suites: [core, full]
tags: [java, concurrency, race-condition, atomicity]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/AuditSequence.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/AuditSequence.java, public-tests/AuditSequencePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, AuditSequencePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/AuditSequence.java, AuditSequenceHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, AuditSequenceHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
