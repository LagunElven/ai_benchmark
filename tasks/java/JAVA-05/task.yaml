id: JAVA-05
revision: 1
name: Preserve order pricing rules while simplifying the implementation
category: java
difficulty: medium
suites: [core, full]
tags: [java, refactoring, pricing, behavior-preservation]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/OrderPricing.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/OrderPricing.java, public-tests/OrderPricingPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, OrderPricingPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/OrderPricing.java, OrderPricingHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, OrderPricingHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
