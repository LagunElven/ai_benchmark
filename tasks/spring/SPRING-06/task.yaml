id: SPRING-06
revision: 1
name: Reject stale versioned updates without overwriting fields
category: spring
difficulty: hard
suites: [core, full]
tags: [spring, jpa, dynamic-update, optimistic-locking, concurrency]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/VersionedProfile.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/VersionedProfile.java, public-tests/VersionedProfilePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, VersionedProfilePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/VersionedProfile.java, VersionedProfileHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, VersionedProfileHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
