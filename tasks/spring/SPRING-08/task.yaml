id: SPRING-08
revision: 1
name: Retry asynchronous operations without blocking
category: spring
difficulty: hard
suites: [core, full]
tags: [spring, reactor, retry, asynchronous, backoff]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/AsyncRetry.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/AsyncRetry.java, public-tests/AsyncRetryPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, AsyncRetryPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/AsyncRetry.java, AsyncRetryHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, AsyncRetryHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
