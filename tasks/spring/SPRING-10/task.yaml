id: SPRING-10
revision: 1
name: Preserve consistency across order and payment services
category: spring
difficulty: hard
suites: [core, full]
tags: [spring, transaction, distributed, compensation, idempotency]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 6000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/CheckoutCoordinator.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/CheckoutCoordinator.java, public-tests/CheckoutCoordinatorPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, CheckoutCoordinatorPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/CheckoutCoordinator.java, CheckoutCoordinatorHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, CheckoutCoordinatorHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
