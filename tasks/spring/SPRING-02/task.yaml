id: SPRING-02
revision: 1
name: Map REST exceptions to stable API errors
category: spring
difficulty: medium
suites: [core, full]
tags: [spring, rest, exception-handling, api]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/ApiErrorMapper.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/ApiErrorMapper.java, public-tests/ApiErrorMapperPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, ApiErrorMapperPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/ApiErrorMapper.java, ApiErrorMapperHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, ApiErrorMapperHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
