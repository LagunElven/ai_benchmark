id: SPRING-04
revision: 1
name: Preserve fields during Hibernate-style dirty updates
category: spring
difficulty: medium
suites: [core, full]
tags: [spring, hibernate, jpa, dirty-checking, patch]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/CustomerDirtyUpdate.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/CustomerDirtyUpdate.java, public-tests/CustomerDirtyUpdatePublicTest.java]
    - name: public behavior
      command: [java, -cp, out, CustomerDirtyUpdatePublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/CustomerDirtyUpdate.java, CustomerDirtyUpdateHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, CustomerDirtyUpdateHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
