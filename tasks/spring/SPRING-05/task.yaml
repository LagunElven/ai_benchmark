id: SPRING-05
revision: 1
name: Reject stale optimistic-lock updates
category: spring
difficulty: medium
suites: [smoke, core, full]
tags: [spring, jpa, optimistic-locking, concurrency, repair]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/OptimisticStock.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/OptimisticStock.java, public-tests/OptimisticStockPublicTest.java]
    - name: public-tests
      command: [java, -cp, out, OptimisticStockPublicTest]
  hidden:
    - name: hidden-tests
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/OptimisticStock.java, OptimisticStockHiddenTest.java]
    - name: hidden-tests
      command: [java, -cp, out-hidden, OptimisticStockHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
