id: SPRING-09
revision: 1
name: Enforce bearer and CSRF checks for REST requests
category: spring
difficulty: hard
suites: [core, full]
tags: [spring, security, bearer, csrf, rest]
modes: [one-shot, repair]
toolchain:
  language: java
  version: "17"
  requirements: [javac 17+]
runtime:
  internet: false
  max_iterations: 3
  timeout_seconds: 120
  max_output_tokens: 5000
workspace:
  source: workspace
  include:
    - {source: public-tests, target: public-tests}
  expected_modified_files: [src/main/java/RequestAuthorizer.java]
validation:
  public:
    - name: compile
      command: [javac, -encoding, UTF-8, -d, out, src/main/java/RequestAuthorizer.java, public-tests/RequestAuthorizerPublicTest.java]
    - name: public behavior
      command: [java, -cp, out, RequestAuthorizerPublicTest]
  hidden:
    - name: hidden compile
      command: [javac, -encoding, UTF-8, -d, out-hidden, src/main/java/RequestAuthorizer.java, RequestAuthorizerHiddenTest.java]
    - name: hidden behavior
      command: [java, -cp, out-hidden, RequestAuthorizerHiddenTest]
metrics: [build_success, hidden_tests_passed, pass_at_1, pass_at_3, files_modified, unnecessary_files_modified]
metric_extractors: []
